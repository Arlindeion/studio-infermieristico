<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Admin — Studio Infermieristico</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon-16.png') }}?v=1" type="image/png" sizes="16x16">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon-32.png') }}?v=1" type="image/png" sizes="32x32">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}?v=1" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}?v=1" sizes="180x180">
    <link rel="preload" href="{{ url_for('static', filename='fonts/atkinson-hyperlegible/AtkinsonHyperlegible-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/bricolage-grotesque/BricolageGrotesque-ExtraBold.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v=4.4">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=4.5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=5.3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=4.3">
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <div class="login-logo">
    <img src="{{ url_for('static', filename='img/logo_black.png') }}" alt="Studio Infermieristico" class="logo-login" width="469" height="589">
</div>
        <h1>Area riservata</h1>
        <p class="sottotitolo">Accesso esclusivo per l'amministratore</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="login-errore">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin/login">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-gruppo">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-gruppo">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-full-width">Accedi</button>
        </form>
        <p class="login-footer">
            <a href="/" class="login-footer-link">← Torna al sito</a>
        </p>
    </div>
</div>

</body>
</html>
